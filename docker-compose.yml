

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - storage-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - storage-network

  storage-node-1:
    build: ./storage-node
    container_name: storage-node-1
    environment:
      - PORT=5001
      - NODE_ID=node-1
      - STORAGE_PATH=./storage
      - BACKEND_URL=http://backend:5000
      - HEARTBEAT_INTERVAL_MS=5000
    volumes:
      - storage_node_1_data:/app/storage
    networks:
      - storage-network

  storage-node-2:
    build: ./storage-node
    container_name: storage-node-2
    environment:
      - PORT=5002
      - NODE_ID=node-2
      - STORAGE_PATH=./storage
      - BACKEND_URL=http://backend:5000
      - HEARTBEAT_INTERVAL_MS=5000
    volumes:
      - storage_node_2_data:/app/storage
    networks:
      - storage-network

  storage-node-3:
    build: ./storage-node
    container_name: storage-node-3
    environment:
      - PORT=5003
      - NODE_ID=node-3
      - STORAGE_PATH=./storage
      - BACKEND_URL=http://backend:5000
      - HEARTBEAT_INTERVAL_MS=5000
    volumes:
      - storage_node_3_data:/app/storage
    networks:
      - storage-network

  backend:
    build: ./server
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - NODE_REQUEST_TIMEOUT_MS=3000
      - RUNNING_IN_DOCKER=true
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/distributed-file-storage
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - CHUNK_SIZE=1048576
      - REPLICATION_FACTOR=2
      - HEARTBEAT_TIMEOUT_MS=15000
      - RECOVERY_INTERVAL_MS=20000
    depends_on:
      - mongodb
      - redis
      - storage-node-1
      - storage-node-2
      - storage-node-3
    networks:
      - storage-network

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - storage-network

networks:
  storage-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  storage_node_1_data:
  storage_node_2_data:
  storage_node_3_data: